<!doctype html>
<!-- The light phil: the phone's files and the PC's, in phil's tiles and theme (Serve.java answers what it asks for). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>phil</title>
<!-- phil's look as on the PC: its shared styles, these, then the theme in use (which wins). -->
<link rel="stylesheet" href="/theme/base.css" id="theme-base">
<link rel="stylesheet" href="/ui/style.css">
<link rel="stylesheet" href="/theme/theme.css" id="theme">
</head>
<body>
  <header id="bar">
    <button id="up" class="icon" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <div id="where"><span id="title">phil</span><span id="path"></span></div>
    <button id="to-music" class="text" aria-label="Music">Music</button>
    <button id="to-cams" class="text" aria-label="Cams">Cams</button>
    <button id="cols" class="icon" aria-label="Tile size"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
    <button id="menu-button" class="icon" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg></button>
  </header>
  <nav id="places" aria-label="Places"></nav>
  <div id="update" hidden><span></span><button>Update</button></div>
  <main id="grid"></main>
  <!-- Music (music.js): the phone's songs, the PC's, the radio. -->
  <nav id="music-sources" aria-label="Music" hidden></nav>
  <div id="music-modes" hidden><button data-mode="albums" class="here">Albums</button><button data-mode="songs">Songs</button></div>
  <main id="music" hidden></main>
  <!-- The cameras (cams.js): a tile each; one over everything, with its pan and tilt. -->
  <main id="cams" hidden></main>
  <div id="cam-view" hidden>
    <video id="cam-video" muted playsinline autoplay></video>
    <div class="cam-top">
      <button id="cam-close" class="icon" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="cam-title"><span id="cam-view-name"></span><span id="cam-via"></span></span>
      <button id="cam-quality" class="text" aria-label="Quality">HD</button>
    </div>
    <span id="cam-say"></span>
    <div class="cam-controls">
      <div id="cam-presets"></div>
      <div class="cam-pad">
        <button class="icon dir up" data-y="1" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="icon dir left" data-x="-1" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="icon dir right" data-x="1" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="icon dir down" data-y="-1" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div id="cam-zoom">
        <button class="icon dir" data-zoom="1" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon dir" data-zoom="-1" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
    </div>
  </div>
  <!-- The PC's copies to this phone (transfers.js), along the bottom. -->
  <div id="transfers" hidden></div>
  <!-- What's playing (MusicService), along the bottom: a tap opens the player. -->
  <div id="mini" hidden>
    <button class="mini-now"><span class="mini-cover"><img alt=""></span><span class="mini-text"><span class="mini-title"></span><span class="mini-artist"></span></span></button>
    <button class="icon mini-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M18 5v14L8 12z" fill="currentColor"/><path d="M6 5v14"/></svg></button>
    <button class="icon mini-play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></button>
    <button class="icon mini-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 5v14l10-7z" fill="currentColor"/><path d="M18 5v14"/></svg></button>
  </div>
  <div id="player" hidden>
    <button id="player-close" class="icon" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="player-cover"><img alt=""></div>
    <div class="player-title"></div>
    <div class="player-artist"></div>
    <div class="player-seek"><span class="player-time">0:00</span><input type="range" class="player-pos" min="0" max="1000" value="0" aria-label="Position"><span class="player-length">0:00</span></div>
    <div class="player-buttons">
      <button class="icon player-shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg></button>
      <button class="icon player-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M18 5v14L8 12z" fill="currentColor"/><path d="M6 5v14"/></svg></button>
      <button class="icon player-play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></button>
      <button class="icon player-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 5v14l10-7z" fill="currentColor"/><path d="M18 5v14"/></svg></button>
      <button class="icon player-repeat" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg><span class="one">1</span></button>
    </div>
    <div class="player-next-up"><span class="heading-text">Next up</span><ol class="player-queue"></ol></div>
  </div>
  <div id="message" hidden><p></p><button hidden></button></div>
  <button id="send-here" class="fab" hidden aria-label="Send files here"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <div id="menu" hidden>
    <button data-do="reload">Reload</button>
    <button data-do="hidden">Show hidden files</button>
    <button data-do="updates">Check for updates</button>
    <button data-do="setup">PC and sharing…</button>
  </div>
  <!-- A long press's actions. -->
  <div id="sheet" hidden><div class="sheet-title"></div><div class="sheet-buttons"></div></div>
  <!-- A picture, a video or a song, over the folder; Back (or ×) closes it. -->
  <div id="viewer" hidden>
    <button id="viewer-close" class="icon" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="viewer-body"></div>
    <div id="viewer-foot"><span id="viewer-name"></span><button id="viewer-action"></button></div>
  </div>
  <div id="toast" hidden></div>
<script src="/ui/app.js" type="module"></script>
<script src="/ui/music.js" type="module"></script>
<script src="/ui/cams.js" type="module"></script>
<script src="/ui/transfers.js" type="module"></script>
</body>
</html>
