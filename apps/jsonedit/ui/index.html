<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jsonedit</title>
  <!-- Relative URLs: jsonedit is also served inside other apps (engine/server.js). -->
  <link rel="stylesheet" href="engine/ui/kit.css">
  <link rel="stylesheet" href="ui/style.css">
  <script type="module" src="ui/app.js"></script>
</head>
<body>
  <main>
    <section id="tree" tabindex="0" aria-label="JSON"></section>

    <!-- A file that isn't valid JSON opens here, to be fixed as text. -->
    <section id="fix" hidden>
      <p id="fix-error"></p>
      <textarea id="fix-text" spellcheck="false" wrap="off" aria-label="The file's text"></textarea>
      <div class="buttons"><button id="fix-apply">Show as tree</button></div>
    </section>

    <header id="bar" class="overlay-bar top">
      <div id="file">
        <span id="file-name">Untitled</span><span id="dirty" title="Unsaved changes" hidden>●</span>
        <span id="file-dir"></span>
      </div>
      <input id="search" type="search" placeholder="Find  Ctrl+F" spellcheck="false" autocomplete="off">
      <span id="search-count"></span>
      <button id="btn-undo" class="icon" title="Undo (Ctrl+Z)">↶</button>
      <button id="btn-redo" class="icon" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button id="btn-open" title="Open a file (Ctrl+O)">Open…</button>
      <button id="btn-save" title="Save (Ctrl+S); Save as: Ctrl+Shift+S">Save</button>
      <select id="indent" title="Indentation the file is saved with">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tabs</option>
      </select>
      <button id="btn-close" class="icon close-button" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <form id="path-form" hidden>
        <label for="path-input" id="path-label">Open</label>
        <input id="path-input" type="text" spellcheck="false" autocomplete="off">
        <button type="submit" id="path-ok">Open</button>
        <button type="button" id="path-cancel">Cancel</button>
      </form>
    </header>

    <footer id="status" class="overlay-bar bottom">
      <span id="where"></span>
      <span id="keys">Enter edit · F2 rename · Shift+arrows select · Insert add · Del delete · right-click for more</span>
    </footer>
  </main>

  <menu id="menu" hidden></menu>
</body>
</html>
