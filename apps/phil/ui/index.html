<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>phil</title>
  <link rel="stylesheet" href="/ui/vendor/xterm.css">
  <link rel="stylesheet" href="/themes/base.css">
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="stylesheet" id="theme" href="/themes/overlay.css"> <!-- the one in the settings (applySettings) -->
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-9 9"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="1"/><path d="M16 10l5-3v10l-5-3z"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-network" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="10" rx="1"/><path d="M12 13v4M5 21h14M12 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
      <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M5 13l2-8h10l2 8M17 16.5h.01"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 9l3 3-3 3M12 15h5"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4l-1.1 1.1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.1-1.1"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    </defs>
  </svg>

  <!-- Across the whole window, over the sidebar too: its button stays put. -->
  <header id="toolbar" class="overlay-bar">
    <div class="nav-buttons">
      <button id="btn-sidebar" class="icon toggle" title="Places sidebar: hover to look, click to keep it open (F9)"><svg><use href="#i-sidebar"/></svg></button>
      <button id="btn-back" class="icon" title="Back (Alt+←)"><svg><use href="#i-back"/></svg></button>
      <button id="btn-forward" class="icon" title="Forward (Alt+→)"><svg><use href="#i-forward"/></svg></button>
      <button id="btn-up" class="icon" title="Parent folder (Backspace)"><svg><use href="#i-up"/></svg></button>
    </div>
    <div id="location-wrap">
      <nav id="crumbs" title="Ctrl+L to type a path"></nav>
      <input id="location" type="text" spellcheck="false" autocomplete="off" hidden>
    </div>
    <input id="filter" type="search" placeholder="Filter  /" spellcheck="false" autocomplete="off">
    <select id="sort" title="Sort">
      <option value="name">Name</option>
      <option value="mtime">Date</option>
      <option value="size">Size</option>
      <option value="kind">Type</option>
    </select>
    <button id="btn-terminal" class="icon toggle" title="Terminal (F4)"><svg><use href="#i-terminal"/></svg></button>
    <button id="btn-hidden" class="icon toggle" title="Show hidden files (Ctrl+H)"><svg><use href="#i-eye"/></svg></button>
    <input id="zoom" type="range" min="128" max="480" step="8" title="Thumbnail size (Ctrl +/−)">
    <button id="btn-close" class="icon close-button" title="Close phil"><svg><use href="#i-close"/></svg></button>
  </header>

  <aside id="sidebar">
    <!-- Under the top bar: it shows while the bar is faded out. -->
    <div class="brand" aria-hidden="true"><svg><use href="#i-folder"/></svg>phil</div>
    <nav id="places" aria-label="Places"></nav>
    <section id="tags-panel">
      <h3 class="heading">Tags</h3>
      <p id="tags-status" class="hint" hidden></p>
      <nav id="tags" aria-label="Tags"></nav>
    </section>
  </aside>

  <main>
    <div id="files">

      <section id="grid" tabindex="0" aria-label="Files"></section>

      <footer id="status" class="overlay-bar">
        <span id="status-count"></span>
        <span id="status-progress"></span>
        <span id="status-thumbdir"></span>
        <select id="theme-pick" title="Theme: how names sit on the tiles (files in ~/.config/phil/themes)" aria-label="Theme"></select>
      </footer>
    </div>
    <div id="term-panel" hidden>
      <div id="term-resize" title="Drag to resize"></div>
      <div id="term"></div>
    </div>
  </main>

  <div id="viewer" hidden>
    <div class="stage"></div>
    <button class="icon nav prev" title="Previous (←)"><svg><use href="#i-back"/></svg></button>
    <button class="icon nav next" title="Next (→)"><svg><use href="#i-forward"/></svg></button>
    <div class="bar">
      <span class="caption"></span>
      <button class="open-mpv"><svg><use href="#i-play"/></svg> mpv</button>
      <button class="open-ext" title="Open with default app"><svg><use href="#i-external"/></svg> Open</button>
      <button class="icon close" title="Close (Esc)"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>

  <div id="app-view" hidden></div>

  <menu id="context" hidden></menu>

  <dialog id="props">
    <form method="dialog">
      <p class="title"></p>
      <p class="where"></p>
      <dl class="facts"></dl>
      <section class="phil">
        <h3>phil</h3>
        <label for="props-desc">Description</label>
        <input id="props-desc" type="text" autocomplete="off" placeholder="shown above the name">
        <label for="props-tags" class="tags-label">Tags</label>
        <input id="props-tags" type="text" autocomplete="off" placeholder="separated by commas">
        <p class="hint" id="props-found" hidden></p>
        <div class="autotag">
          <label class="check"><input type="checkbox" id="props-autotag"> Tag the pictures in it automatically, and make them findable by what they show</label>
          <p class="hint" id="props-autotag-hint"></p>
        </div>
        <div class="hook">
          <label for="props-hook">When it changes, run</label>
          <div class="hook-row">
            <input id="props-hook" type="text" spellcheck="false" autocomplete="off" placeholder="a command, e.g. sudo systemctl restart keyd">
            <button type="button" class="run" title="Run it now, to try it">Run now</button>
          </div>
          <p class="hint">While a phil window shows this folder, when the file changes, the command runs in bash, in the folder, with the file as $1.</p>
          <pre class="output" hidden></pre>
        </div>
      </section>
      <div class="buttons">
        <button value="cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm">
    <form method="dialog">
      <p class="title"></p>
      <p class="detail"></p>
      <div class="buttons">
        <button value="cancel">Cancel</button>
        <button value="ok" class="danger" autofocus>Delete</button>
      </div>
    </form>
  </dialog>
</body>
</html>
