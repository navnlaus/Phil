<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music</title>
  <!-- Relative URLs: musicview is also served inside other apps (engine/server.js). -->
  <link rel="stylesheet" href="themes/base.css">
  <link rel="stylesheet" href="ui/style.css">
  <link rel="stylesheet" href="themes/current.css"> <!-- the theme in use: its colors (engine/themes.js) -->
  <script type="module" src="ui/app.js"></script>
</head>
<body>
  <!-- Icons (Lucide's, ISC: phil's ui/vendor/lucide-sprite.svg). -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></symbol>
    <symbol id="i-skip-back" viewBox="0 0 24 24"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></symbol>
    <symbol id="i-skip-forward" viewBox="0 0 24 24"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-repeat-1" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
    <symbol id="i-volume-2" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></symbol>
    <symbol id="i-volume-x" viewBox="0 0 24 24"><path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z"/><path d="m16.5 14.5 5-5"/><path d="m16.5 9.5 5 5"/></symbol>
    <symbol id="i-list-music" viewBox="0 0 24 24"><path d="M16 5H3"/><path d="M11 12H3"/><path d="M11 19H3"/><path d="M21 16V5"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-disc-3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M6 12c0-1.7.7-3.2 1.8-4.2"/><circle cx="12" cy="12" r="2"/><path d="M18 12c0 1.7-.7 3.2-1.8 4.2"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="i-external-link" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-list-plus" viewBox="0 0 24 24"><path d="M16 5H3"/><path d="M11 12H3"/><path d="M16 19H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
  </svg>

  <div class="mu-page">
    <header class="mu-head">
      <h2>Music</h2>
      <div class="mu-tabs" role="tablist">
        <button type="button" role="tab" data-tab="albums" aria-selected="true">Albums <span class="n"></span></button>
        <button type="button" role="tab" data-tab="artists" aria-selected="false">Artists <span class="n"></span></button>
        <button type="button" role="tab" data-tab="songs" aria-selected="false">Songs <span class="n"></span></button>
        <button type="button" role="tab" data-tab="genres" aria-selected="false">Genres <span class="n"></span></button>
        <button type="button" role="tab" data-tab="radio" aria-selected="false">Radio <span class="n"></span></button>
      </div>
      <input class="mu-filter" type="search" placeholder="Find" spellcheck="false" autocomplete="off" aria-label="Find">
      <select class="mu-sort" aria-label="Sort">
        <option value="name">Name</option>
        <option value="artist">Artist</option>
        <option value="year">Year</option>
        <option value="added">Recently added</option>
      </select>
      <span class="mu-scan hint"></span>
      <button class="icon mu-rescan" type="button" title="Look for new and changed songs in the music folders"><svg><use href="#i-refresh-cw"/></svg></button>
      <button class="icon close" type="button" title="Close (Esc)" hidden><svg><use href="#i-x"/></svg></button>
    </header>
    <!-- An album's, an artist's or a genre's songs, over the list (Back, or Esc, comes back). -->
    <section class="mu-detail" hidden></section>
    <main class="mu-main"></main>
    <p class="mu-empty hint" hidden></p>
  </div>

  <!-- What's playing, and what's next. -->
  <aside class="mu-queue" hidden>
    <div class="mu-queue-head"><h3 class="heading">Next</h3><button type="button" class="mu-queue-clear">Clear</button></div>
    <ol class="mu-queue-list"></ol>
  </aside>
  <footer class="mu-player">
    <div class="mu-now">
      <div class="mu-now-cover"><img alt=""><svg><use href="#i-music"/></svg></div>
      <div class="mu-now-text"><span class="mu-now-title">Nothing playing</span><span class="mu-now-artist"></span></div>
    </div>
    <div class="mu-controls">
      <div class="mu-buttons">
        <button type="button" class="icon toggle mu-shuffle" title="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
        <button type="button" class="icon mu-prev" title="Previous"><svg><use href="#i-skip-back"/></svg></button>
        <button type="button" class="icon mu-play" title="Play (Space)"><svg><use href="#i-play"/></svg></button>
        <button type="button" class="icon mu-next" title="Next"><svg><use href="#i-skip-forward"/></svg></button>
        <button type="button" class="icon toggle mu-repeat" title="Repeat" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="mu-seek"><span class="mu-time">0:00</span><input type="range" class="mu-pos" min="0" max="1000" value="0" aria-label="Position"><span class="mu-length">0:00</span></div>
    </div>
    <div class="mu-side">
      <button type="button" class="icon mu-mute" title="Mute"><svg><use href="#i-volume-2"/></svg></button>
      <input type="range" class="mu-volume" min="0" max="100" value="80" aria-label="Volume">
      <button type="button" class="icon toggle mu-queue-button" title="Next up" aria-pressed="false"><svg><use href="#i-list-music"/></svg></button>
    </div>
    <audio class="mu-audio" preload="auto"></audio>
  </footer>

  <!-- A radio station, added or changed. -->
  <dialog class="mu-station">
    <form method="dialog">
      <p class="title">Add a station</p>
      <div class="fields">
        <label for="st-name">Name</label><input id="st-name" name="name" type="text" autocomplete="off" required>
        <label for="st-url">Stream</label><input id="st-url" name="url" type="text" autocomplete="off" spellcheck="false" placeholder="https://… (a stream, or a .pls or .m3u)" required>
        <label for="st-homepage">Web page</label><input id="st-homepage" name="homepage" type="text" autocomplete="off" spellcheck="false" placeholder="optional">
        <label for="st-image">Logo</label><input id="st-image" name="image" type="text" autocomplete="off" spellcheck="false" placeholder="a picture's address (optional)">
        <label for="st-genre">Genre</label><input id="st-genre" name="genre" type="text" autocomplete="off" placeholder="optional">
      </div>
      <p class="error" hidden></p>
      <div class="buttons"><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Add</button></div>
    </form>
  </dialog>
  <div class="mu-menu" hidden></div>
  <div class="mu-say" hidden></div>
</body>
</html>
